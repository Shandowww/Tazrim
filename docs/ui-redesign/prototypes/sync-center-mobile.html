<div class="app">
<header class="top"><h1>מרכז הסנכרון</h1><select id="scope" class="scope" aria-label="בחירת תקציב"><option value="personal">התקציב האישי</option><option value="shared">התקציב המשותף</option></select></header>

</div>
<script>
const paths={home:'M3 10 12 3l9 7M5 9v12h14V9M9 21v-7h6v7',bank:'M3 9h18M4 9V7l8-4 8 4v2M5 12v6m7-6v6m7-6v6M3 21h18',sync:'M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5m-3 9a9 9 0 0 0 15 2l3-3m0 5v-5h-5',menu:'M4 6h16M4 12h16M4 18h16',inbox:'M4 4h16l2 13v3H2v-3L4 4Zm-2 12h6l2 3h4l2-3h6',calendar:'M4 5h16v16H4V5Zm3-3v6m10-6v6M4 10h16M8 14h1m3 0h1m3 0h1M8 17h1m3 0h1',files:'M7 3h9l4 4v14H7V3Zm9 0v5h4M3 7v14M10 12h7m-7 4h7',settings:'M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6M9 15v6',left:'m14 6-6 6 6 6',right:'m10 6 6 6-6 6',plus:'M12 5v14M5 12h14',check:'m5 12 4 4L19 6',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l3 2',alert:'M12 3 2 21h20L12 3Zm0 7v4m0 3v1',minus:'M5 12h14',upload:'M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5',card:'M3 5h18v14H3V5Zm0 5h18M7 15h3',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm5 12 6 6'};
const icon=name=>'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="'+paths[name]+'"/></svg>';
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const reports=[
{id:1,name:'כאל · חיוב אוקטובר',file:'כאל-דוח-אוקטובר-2026.pdf',account:'כרטיס 1234',scope:'personal',status:'new',next:'בדיקת הדוח ואישור קליטה',date:'08.11',amount:'2,480',ready:true},
{id:2,name:'הפועלים · ספטמבר',file:'דוח-בנק-ספטמבר-2026.xlsx',account:'חשבון 5678',scope:'personal',status:'partial',next:'נשאר לסווג 2 תנועות',date:'07.11',amount:'1,240',ready:true},
{id:3,name:'מסמך חדש מהתיקייה',file:'דוח-חדש-לבדיקה.pdf',account:'טרם זוהה',scope:'unassigned',status:'new',next:'נדרש אישור לקריאת הקובץ',date:'08.11',amount:'860',ready:false},
{id:4,name:'ישראכרט · אוקטובר',file:'ישראכרט-אוקטובר-2026.pdf',account:'כרטיס 4321',scope:'shared',status:'new',next:'בהכנה אוטומטית',date:'08.11',amount:'3,120',waiting:true,ready:true}
];
for(let index=0;index<20;index++)reports.push({id:index+5,name:(index%2?'כאל':'הפועלים')+' · דוח '+(index+1),file:'דוח-דוגמה-'+(index+1)+'.pdf',account:index%2?'כרטיס 1234':'חשבון 5678',scope:index%3?'personal':'shared',status:'digested',next:'הטיפול הושלם',date:'05.11',amount:'1,000',ready:true});
const entities=[{id:'b1',scope:'personal',name:'הפועלים',suffix:'חשבון 5678',kind:'bank',months:['file','file','file','partial','missing','file']},{id:'c1',scope:'personal',name:'כאל',suffix:'כרטיס 1234',kind:'card',months:['file','file','zero','missing','file','pending']},{id:'b2',scope:'shared',name:'חשבון הבית',suffix:'חשבון 2468',kind:'bank',months:['file','missing','file','file','file','missing']},{id:'c2',scope:'shared',name:'ישראכרט',suffix:'כרטיס 4321',kind:'card',months:['file','file','file','zero','file','pending']}];
const months=['מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר'];
const labels={new:'חדש',partial:'עוכל חלקית',digested:'עוכל',file:'נקלט',missing:'חסר',pending:'לבדיקה',zero:'ללא פעילות',future:'לא במעקב'};
const coverageLabels={...labels,partial:'כיסוי חלקי'};
const state={coverageEntity:'b1',view:'attention',scope:'personal',page:1,filter:'all',query:'',destination:'all',report:1,origin:'attention',step:0,approved:false,entity:'b1',month:0,period:0,setup:0,policy:false,category:'מזון',notice:''};
const tabs=[['attention','לטיפול','inbox'],['missing','מה חסר','calendar'],['reports','הדוחות','files'],['settings','הגדרות','settings']];
const scopeName=scope=>scope==='personal'?'אישי':scope==='shared'?'משותף':'טרם שויך';
const back=(to,label='חזרה')=>'<button class="back" data-nav="'+to+'">'+icon('right')+label+'</button>';
const heading=(title,text,action='')=>'<div class="intro"><div><h2 tabindex="-1">'+title+'</h2>'+(text?'<p>'+text+'</p>':'')+'</div>'+action+'</div>';
const button=(text,attr,primary=false)=>'<button class="action '+(primary?'primary ':'')+'" '+attr+'>'+text+'</button>';
const report=()=>reports.find(row=>row.id===state.report);
function rowHTML(row){return '<button class="row" data-open="'+row.id+'"><span class="fileIcon">'+icon('files')+'</span><span class="text"><h3>'+esc(row.name)+'</h3><p>'+esc(row.account)+' · '+scopeName(row.scope)+' · <bdi>'+row.date+'</bdi></p><div class="next">'+row.next+'</div></span><span class="badge '+(row.status==='digested'?'':'active')+'">'+labels[row.status]+'</span>'+icon('left')+'</button>'}
function attention(){const todo=reports.filter(row=>row.status!=='digested'&&!row.waiting),waiting=reports.filter(row=>row.waiting);return heading('מה צריך את תשומת הלב שלך?',todo.length?'יש '+todo.length+' דוחות שאפשר להתקדם איתם.':'אין כרגע החלטות שממתינות לך.',button(icon('plus')+'דוח','data-nav="add"'))+'<div class="stack">'+todo.slice(0,6).map(rowHTML).join('')+'</div>'+(waiting.length?'<details><summary>'+icon('clock')+' '+waiting.length+' דוח בהכנה · אין צורך לפעול כרגע</summary>'+waiting.map(rowHTML).join('')+'</details>':'')+'<div class="divider"></div><button class="quietRow" data-nav="missing"><span>אילו דוחות עוד צריך להוריד?</span>'+icon('left')+'</button><button class="quietRow" data-nav="reports"><span>כל הדוחות וההיסטוריה <small>('+reports.length+')</small></span>'+icon('left')+'</button>'}
function reportList(){let filtered=reports.filter(row=>(state.filter==='all'||row.status===state.filter)&&(state.destination==='all'||state.destination==='current'&&row.scope===state.scope||state.destination==='unassigned'&&row.scope==='unassigned')&&(!state.query||(row.name+' '+row.file).includes(state.query)));const pages=Math.max(1,Math.ceil(filtered.length/6));state.page=Math.min(state.page,pages);return heading('הדוחות שלך','מוצאים דוח בלי לעבור על כל התיבה.')+'<label class="field">חיפוש לפי שם<input id="search" type="search" placeholder="למשל: כאל" value="'+esc(state.query)+'"></label><div class="filters"><label class="field">מצב הטיפול<select id="filter" class="control">'+[['all','כל המצבים'],['new','חדש'],['partial','עוכל חלקית'],['digested','עוכל']].map(pair=>'<option value="'+pair[0]+'" '+(state.filter===pair[0]?'selected':'')+'>'+pair[1]+'</option>').join('')+'</select></label><label class="field">תקציב<select id="destination" class="control">'+[['all','כל התיבה שלי'],['current',scopeName(state.scope)],['unassigned','טרם שויך']].map(pair=>'<option value="'+pair[0]+'" '+(state.destination===pair[0]?'selected':'')+'>'+pair[1]+'</option>').join('')+'</select></label></div><div class="sectionLabel"><span>'+filtered.length+' דוחות</span><span>עמוד '+state.page+' מתוך '+pages+'</span></div><div class="stack">'+(filtered.slice((state.page-1)*6,state.page*6).map(rowHTML).join('')||'<p class="callout">לא נמצאו דוחות בסינון הזה.</p>')+'</div><div class="pager">'+button('הקודם','data-page="-1" '+(state.page===1?'disabled':''))+'<span>'+state.page+' / '+pages+'</span>'+button('הבא','data-page="1" '+(state.page===pages?'disabled':''))+'</div>'}
function detail(){const item=report();return back(state.origin,'חזרה לדוחות')+heading(item.name,item.account+' · '+scopeName(item.scope))+'<section class="surface"><span class="badge active">'+labels[item.status]+'</span><div class="facts"><div class="fact"><span>מה השלב הבא?</span><strong>'+item.next+'</strong></div><div class="fact"><span>התקבל בתיבה</span><bdi>'+item.date+'.2026</bdi></div></div>'+(item.status==='digested'?'<p class="callout">הטיפול בדוח הושלם. המידע הכספי נשמר.</p>':item.waiting?'<p class="callout">הדוח בהכנה אוטומטית. הוא יופיע לטיפול כשיהיה מוכן לבדיקה.</p>':'<button class="action primary full" data-review>'+(!item.ready?'בדיקת המקור ואישור פענוח':item.status==='partial'?'המשך מהמקום שעצרתי':'בדיקת הדוח')+icon('left')+'</button>')+'</section><div class="sectionLabel"><span>פעולות נוספות</span></div><div class="surface"><button class="quietRow" data-nav="original"><span>קובץ המקור ושמירתו</span>'+icon('left')+'</button><button class="quietRow" data-nav="proposal"><span>מה הוכן מתוך הדוח?</span>'+icon('left')+'</button></div>'}
function original(){const item=report();return back('detail','חזרה לדוח')+heading('קובץ המקור','כאן נמצאים ההורדה ופרטי השמירה.')+'<div class="surface stack"><h3 class="detailName"><bdi>'+item.file+'</bdi></h3><small>PDF · 148 KB · התקבל '+item.date+'.2026</small>'+button('הורדת המקור','data-info="ביישום המלא יורד כאן קובץ המקור השמור. באבטיפוס אין קובץ פרטי."',true)+'<p class="callout">'+(item.status==='digested'?'העותק יוסר ב־05.12.2026, שלושים יום לאחר השלמת הטיפול. המידע הכספי וההיסטוריה יישמרו.':'הדוח עדיין בטיפול. העותק נשאר זמין, ותקופת 30 הימים תתחיל רק אחרי שהטיפול יושלם.')+'</p><button class="quietRow" data-info="ביישום המלא תיפתח כאן בקשת אישור למחיקת העותק הפרטי. לא נמחק דבר באבטיפוס."><span>מחיקת העותק מהתיבה הפרטית</span>'+icon('left')+'</button></div>'}
function proposal(){return back('detail','חזרה לדוח')+heading('מה הוכן לבדיקה?','הצעה לדוח הזה בלבד.')+'<div class="surface stack"><p>זוהו החשבון וחודש החיוב.</p><div class="facts"><div class="fact"><span>סך בדוח</span><strong><bdi>₪'+report().amount+'</bdi></strong></div><div class="fact"><span>כפילויות שנמצאו</span><span>0</span></div></div><p class="callout">הכנה אינה שמירה בתקציב. בדיקת הנתונים והאישור שלך נדרשים לפני הקליטה.</p>'+button('לבדיקת הדוח','data-review',true)+'</div>'}
function review(){const item=report(),titles=['הדוח והחשבון','הסכומים בדוח','סיווג התנועות','סיכום לפני סיום'];let body='';if(state.step===0)body='<div class="surface stack"><h3>'+esc(item.name)+'</h3><div class="facts"><div class="fact"><span>תקציב</span><strong>'+scopeName(item.scope==='unassigned'?state.scope:item.scope)+'</strong></div><div class="fact"><span>חשבון / כרטיס</span><strong>'+(item.ready?item.account:'כרטיס לדוגמה 1234')+'</strong></div></div>'+(item.ready?'<p class="callout">המזהה מתאים לשיוך שאושר. אפשר להמשיך לבדוק את הסכומים.</p>':'<p class="callout">קודם בודקים את המקור ומאשרים לקרוא אותו. הזיהוי והשיוך יתבצעו רק לאחר האישור.</p><label class="choice"><input id="approved" type="checkbox" '+(state.approved?'checked':'')+'>בדקתי את קובץ הדוגמה ואני מאשר/ת פענוח וזיהוי חשבון.</label>')+'</div>';if(state.step===1)body='<div class="surface stack"><div class="facts"><div class="fact"><span>חודש החיוב</span><strong>אוקטובר 2026</strong></div><div class="fact"><span>הסכום בדוח</span><strong><bdi>₪'+item.amount+'</bdi></strong></div><div class="fact"><span>דוח שנקלט לחודש הזה</span><span>אין</span></div></div><p class="callout">יש לבדוק שהחודש והסכום תואמים למקור לפני שממשיכים.</p></div>';if(state.step===2)body='<div class="surface stack"><h3>נותרו שתי תנועות לבדיקה</h3><p><bdi>סופרמרקט לדוגמה · ₪240</bdi></p><label class="field">קטגוריה<select id="category" class="control"><option '+(state.category==='מזון'?'selected':'')+'>מזון</option><option '+(state.category==='קניות'?'selected':'')+'>קניות</option><option '+(state.category==='ללא קטגוריה'?'selected':'')+'>ללא קטגוריה</option></select></label><div class="divider"></div><p><bdi>תחבורה לדוגמה · ₪80</bdi></p><p class="muted">קטגוריה מוצעת: תחבורה</p><small>ביישום המלא אפשר לעבור בין התנועות ולשמור התקדמות.</small></div>';if(state.step===3)body='<div class="surface stack"><div class="facts"><div class="fact"><span>תקציב</span><strong>'+scopeName(item.scope==='unassigned'?state.scope:item.scope)+'</strong></div><div class="fact"><span>סך הדוח</span><strong><bdi>₪'+item.amount+'</bdi></strong></div><div class="fact"><span>סיווגים</span><span>'+esc(state.category)+' · תחבורה</span></div></div><p class="callout">סיום מאשר ושומר את השינויים. באבטיפוס משתנה רק מצב הדוגמה.</p></div>';return back('detail','חזרה לדוח')+'<p class="eyebrow">שלב '+(state.step+1)+' מתוך 4</p>'+heading(titles[state.step],'כל חלק מקבל מקום ברור משלו.')+'<div class="progress" aria-label="התקדמות הבדיקה">'+titles.map((title,index)=>'<span class="'+(index<=state.step?'done':'')+'"></span>').join('')+'</div>'+body+'<div class="stepActions">'+button('הקודם','data-step="-1" '+(state.step===0?'disabled':''))+'<button class="action primary" data-step="1" '+(state.step===0&&!item.ready&&!state.approved?'disabled':'')+'>'+(state.step===3?'סיום':'הבא')+icon('left')+'</button></div>'}
function completed(){return '<div class="surface center"><div class="tick">'+icon('check')+'</div>'+heading('הדוגמה הושלמה','כך ייראה אישור לאחר שמירה מוצלחת באפליקציה.')+'<p class="info">הדוח עבר ל״עוכל״. נתוני הדוגמה בלבד עודכנו.</p>'+button('חזרה לדוחות לטיפול','data-nav="attention"',true)+'</div>'}
function coverage(){const rows=entities.filter(entity=>entity.scope===state.scope),count=state.period===0?rows.reduce((sum,row)=>sum+row.months.filter(status=>['missing','partial'].includes(status)).length,0):0;return heading('מה חסר להשלמת התמונה?',scopeName(state.scope)+' · בנקים וכרטיסים')+'<div class="period">'+button(icon('right'),'data-period="-1" aria-label="תקופה קודמת"')+'<span>'+(state.period===0?'מאי – אוקטובר 2026':'נובמבר 2025 – אפריל 2026')+'</span>'+button(icon('left'),'data-period="1" aria-label="תקופה הבאה" '+(state.period===0?'disabled':''))+'</div><p class="eyebrow">'+(state.period===0?count+' דוחות חסרים או חלקיים':'המעקב בדוגמה מתחיל במאי 2026')+'</p><div class="legend"><span><i class="dot"></i>נקלט</span><span><i class="dot missing"></i>חסר / חלקי</span><span><i class="dot pending"></i>לבדיקה</span></div><label class="field" style="margin-bottom:12px">חשבון או כרטיס<select id="coverageEntity" class="control">'+rows.map(entity=>'<option value="'+entity.id+'" '+((rows.some(row=>row.id===state.coverageEntity)?state.coverageEntity:rows[0].id)===entity.id?'selected':'')+'>'+entity.name+' · '+entity.suffix+'</option>').join('')+'</select></label><div class="stack">'+rows.filter(entity=>entity.id===(rows.some(row=>row.id===state.coverageEntity)?state.coverageEntity:rows[0].id)).map(entity=>'<article class="surface"><div class="entityHead">'+icon(entity.kind)+'<div class="text"><h3>'+entity.name+'</h3><small>'+entity.suffix+'</small></div></div><div class="months">'+entity.months.map((status,index)=>{status=state.period===0?status:'future';return '<button class="month '+status+'" data-cell="'+entity.id+':'+index+'" aria-label="'+entity.name+' '+months[index]+' '+(coverageLabels[status]||'חלקי')+'"><span>'+(state.period===0?months[index]:['נוב׳ 25','דצמ׳ 25','ינו׳ 26','פבר׳ 26','מרץ 26','אפר׳ 26'][index])+'</span>'+icon(status==='file'?'check':status==='missing'||status==='partial'?'alert':status==='pending'?'clock':'minus')+'<span class="state">'+(coverageLabels[status]||'חלקי')+'</span></button>'}).join('')+'</div></article>').join('')+'</div><p class="info">לוחצים על חודש כדי לדעת מה לעשות. דוח שכבר ממתין לבדיקה לא צריך להוריד שוב.</p>'}
function monthDetail(){const entity=entities.find(row=>row.id===state.entity),status=state.period===0?entity.months[state.month]:'future';let content='';if(status==='missing'||status==='partial')content='<p class="callout">'+(status==='partial'?'נקלט רק חלק מהחודש. נדרש דוח בנק המכסה את החודש המלא.':'יש להוריד את הדוח לחודש הזה מאתר '+entity.name+'.')+'</p><div class="facts"><div class="fact"><span>איזה חשבון?</span><strong>'+entity.suffix+'</strong></div><div class="fact"><span>איזה חודש?</span><strong>'+months[state.month]+' 2026</strong></div></div><p class="info">שומרים בתיקיית Budgit ומריצים את הקיצור, או מעלים כאן.</p>'+button('העלאת הדוח','data-nav="add"',true)+(entity.kind==='card'?'<button class="quietRow" data-info="ביישום המלא ייפתח אישור החודש ללא עסקאות וחיובים, עם בדיקת הזכאות הקיימת. דבר לא סומן אוטומטית."><span>לא היו עסקאות בחודש הזה?</span>'+icon('left')+'</button>':'');else if(status==='pending')content='<p class="callout">הדוח כבר הגיע. נשאר להשלים את הבדיקה, אין צורך להוריד שוב.</p>'+button('פתיחת הדוח לבדיקה','data-open="'+(entity.scope==='personal'?1:4)+'"',true);else content='<p class="callout">'+(status==='file'?'הדוח כבר נקלט. אין צורך להעלות אותו שוב.':status==='zero'?'החודש אושר ללא עסקאות וחיובים. אין דוח שחסר להשלמה.':'החודש נמצא לפני תחילת המעקב בדוגמה. לא נדרש דוח.')+'</p>';return back('missing','חזרה למפת החודשים')+heading(entity.name+' · '+(state.period===0?months[state.month]:['נובמבר 2025','דצמבר 2025','ינואר 2026','פברואר 2026','מרץ 2026','אפריל 2026'][state.month]),entity.suffix)+'<section class="surface stack"><span class="badge '+(['missing','partial'].includes(status)?'warn':'active')+'">'+(coverageLabels[status]||'חלקי')+'</span>'+content+'</section>'}
function settings(){return heading('הגדרות הסנכרון','הכול כאן כשצריך. הדוחות נשארים במסכים שלהם.')+'<div class="stack"><button class="row" data-nav="connection"><span class="fileIcon">'+icon('sync')+'</span><span class="text"><h3>חיבור תיקייה</h3><p>iCloud Drive / Budgit</p></span><span class="settingValue">מחובר</span>'+icon('left')+'</button><button class="row" data-nav="policy"><span class="fileIcon">'+icon('settings')+'</span><span class="text"><h3>הכנת דוחות אוטומטית</h3><p>לתקציב '+scopeName(state.scope)+' בלבד</p></span><span class="settingValue">'+(state.policy?'פעילה':'מושהית')+'</span>'+icon('left')+'</button><button class="row" data-nav="expectations"><span class="fileIcon">'+icon('calendar')+'</span><span class="text"><h3>מועדי דוחות</h3><p>מתי מצפים לדוח ומה לא נדרש</p></span>'+icon('left')+'</button></div>'}
function connection(){return back('settings','חזרה להגדרות')+heading('חיבור התיקייה','מצב החיבור והגדרה לפי המכשיר שלך.')+'<div class="surface stack"><h3>התיקייה שלי</h3><p dir="ltr">iCloud Drive / Budgit</p><div class="facts"><div class="fact"><span>העלאה אחרונה</span><span>היום, 09:42</span></div><div class="fact"><span>הרצה מתוזמנת</span><span>דורשת הגדרה במכשיר</span></div></div>'+button('הגדרת מכשיר / חיבור','data-nav="setup"',true)+'<details><summary>מה קורה לקובץ אחרי ההעלאה?</summary><p>מחיקה מהמכשיר היא בחירה מפורשת ורק אחרי אימות עותק שמור. המקור ב־Budgit נשמר עד 30 יום לאחר השלמת הטיפול. בתיקיית iCloud מחיקה יכולה להסתנכרן לכל המכשירים.</p></details></div>'}
function setup(){const titles=['בחירת התיקייה','חיבור ל־Budgit','תזמון והעדפות'],copy=['באייפון בוחרים את התיקייה דרך Files. ב־Mac בוחרים אותה דרך Finder. אפשר לבחור באותה תיקיית iCloud Drive/Budgit בשני המכשירים.','מעתיקים מפתח חיבור של Budgit להגדרה בקיצור. אותו מפתח ייצור יכול לשמש את שני המכשירים. מפתח בדיקה זמני אינו מתאים.','מגדירים את ההרצה בכל מכשיר ובודקים שהקובץ מגיע. מחיקה לאחר העלאה היא בחירה נפרדת.'];return back('connection','חזרה לחיבור')+'<p class="eyebrow">הגדרה '+(state.setup+1)+' מתוך 3</p>'+heading(titles[state.setup],'הוראות קצרות, שלב אחד בכל פעם.')+'<div class="surface stack"><p>'+copy[state.setup]+'</p>'+(state.setup===1?'<p class="callout">המפתח מוסתר ומוצג רק בזמן ההגדרה. אין כאן מפתח אמיתי.</p>':'')+'</div><div class="stepActions">'+button('הקודם','data-setup="-1" '+(state.setup===0?'disabled':''))+button(state.setup===2?'סיום ההדגמה':'הבא','data-setup="1"',true)+'</div>'}
function policy(){return back('settings','חזרה להגדרות')+heading('הכנה אוטומטית','תקציב '+scopeName(state.scope))+'<div class="surface stack"><p>דוחות עם מזהה שכבר שויך יוכנו לבדיקה.</p><p class="callout">הסכומים יישמרו רק אחרי שתעבור/י על הדוח ותאשר/י בסיום.</p><label class="choice"><input id="policyConsent" type="checkbox">אני מאשר/ת הכנה לתקציב הזה.</label><button class="action primary" id="policyButton" data-policy disabled>'+(state.policy?'השהיית ההכנה':'הפעלת ההכנה בדוגמה')+'</button><small>שינוי באבטיפוס אינו משנה הגדרה באפליקציה.</small></div>'}
function expectations(){return back('settings','חזרה להגדרות')+heading('מועדי דוחות','מתי מתחילים לצפות לכל דוח.')+'<div class="surface stack"><h3>כאל · כרטיס 1234</h3><div class="facts"><div class="fact"><span>מועד צפוי</span><span>15 בחודש הבא</span></div><div class="fact"><span>ימי המתנה נוספים</span><span>3 ימים</span></div></div><p class="callout">ביישום המלא נשארים כאן מועדי הדיווח, החרגות החודשים וההרשאות הקיימים.</p>'+button('למפת הדוחות','data-nav="missing"',true)+'</div>'}
function add(){return back(state.origin,'חזרה לדוחות')+heading('הוספת דוח','קובץ אחד, ואז ממשיכים לבדיקה שלו.')+'<div class="uploadBox">'+icon('upload')+'<h3>בחירת דוח מהמכשיר</h3><small>PDF, CSV, XLS או XLSX</small>'+button('בחירת קובץ לדוגמה','data-sample',true)+'</div><p class="info">אחרי שמירת המקור נכנסים לבדיקה ולשיוך החשבון. העלאה לבדה אינה משנה סכומים.</p><button class="quietRow" data-nav="connection"><span>רוצה להעלות דרך תיקייה קבועה?</span>'+icon('left')+'</button>'}
function render(focus=true){const selected=['detail','review','original','proposal','completed','add'].includes(state.view)?state.origin:state.view==='month'?'missing':['connection','setup','policy','expectations'].includes(state.view)?'settings':state.view;document.getElementById('tabs').innerHTML=tabs.map(tab=>'<button class="tab" data-nav="'+tab[0]+'" '+(selected===tab[0]?'aria-current="page"':'')+'>'+icon(tab[2])+'<span>'+tab[1]+'</span></button>').join('');const pages={attention,missing:coverage,reports:reportList,settings,detail,original,proposal,review,completed,month:monthDetail,connection,setup,policy,expectations,add};document.getElementById('content').innerHTML=(state.notice?'<p class="notice" role="status">'+esc(state.notice)+'</p>':'')+(pages[state.view]||attention)();if(focus)document.querySelector('#content h2')?.focus({preventScroll:true});}
function go(view){if(view==='add'&&['attention','reports','missing'].includes(state.view))state.origin=state.view;state.view=view;state.notice='';render()}
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target||target.disabled)return;if(target.dataset.nav){go(target.dataset.nav);return}if(target.dataset.open){if(['attention','reports','missing','month'].includes(state.view))state.origin=state.view==='month'?'missing':state.view;state.report=Number(target.dataset.open);state.approved=false;go('detail');return}if(target.hasAttribute('data-review')){state.step=report().status==='partial'?2:0;go('review');return}if(target.dataset.step){if(state.step===3&&target.dataset.step==='1'){report().status='digested';report().next='הטיפול הושלם';go('completed')}else{state.step+=Number(target.dataset.step);render()}return}if(target.dataset.page){state.page+=Number(target.dataset.page);render();return}if(target.dataset.cell){const pair=target.dataset.cell.split(':');state.entity=pair[0];state.month=Number(pair[1]);go('month');return}if(target.dataset.period){state.period=target.dataset.period==='-1'?-1:0;render();return}if(target.dataset.setup){state.setup+=Number(target.dataset.setup);if(state.setup===3){state.setup=0;go('connection')}else render();return}if(target.hasAttribute('data-policy')){state.policy=!state.policy;go('settings');return}if(target.hasAttribute('data-sample')){state.report=3;go('detail');return}if(target.dataset.info){state.notice=target.dataset.info;render();return}});
document.addEventListener('change',event=>{if(event.target.id==='coverageEntity'){state.coverageEntity=event.target.value;render(false)}if(event.target.id==='scope'){state.scope=event.target.value;state.page=1;if(state.view==='month')state.view='missing';render()}if(event.target.id==='filter'||event.target.id==='destination'){state[event.target.id]=event.target.value;state.page=1;render(false)}if(event.target.id==='approved'){state.approved=event.target.checked;document.querySelector('[data-step="1"]').disabled=!state.approved}if(event.target.id==='category')state.category=event.target.value;if(event.target.id==='policyConsent')document.getElementById('policyButton').disabled=!event.target.checked});
document.addEventListener('input',event=>{if(event.target.id!=='search')return;const position=event.target.selectionStart;state.query=event.target.value;state.page=1;render(false);const search=document.getElementById('search');search.focus({preventScroll:true});try{search.setSelectionRange(position,position)}catch{}});
render(false);
</script>
