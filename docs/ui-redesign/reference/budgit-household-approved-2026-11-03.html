#budgit-household-prototype .bp-cat-loans{--bp-cat:light-dark(#26828e,#79ccd6)}
#budgit-household-prototype .bp-cat-other{--bp-cat:light-dark(#7e8899,#aab7c9)}
#budgit-household-prototype .bp-category-stack{display:flex;gap:3px;height:10px;overflow:hidden;border-radius:8px}
#budgit-household-prototype .bp-category-stack>span{background:var(--bp-cat);min-width:2px;height:100%}
#budgit-household-prototype .bp-category-list{margin-top:10px}
#budgit-household-prototype .bp-category-list>div+div,#budgit-household-prototype .bp-category-list>details+details{border-top:1px solid var(--bp-line)}
#budgit-household-prototype .bp-cat-row{display:flex;gap:10px;align-items:center;padding:11px 0;min-height:58px}
#budgit-household-prototype .bp-cat-icon{background:color-mix(in srgb,var(--bp-cat) 14%,var(--bp-surface));color:var(--bp-cat);display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:12px}
#budgit-household-prototype .bp-cat-body{flex:1;min-width:0;display:grid;gap:6px;font-size:14px}
#budgit-household-prototype .bp-cat-track{height:4px;max-width:125px;border-radius:5px;background:var(--bp-bg);overflow:hidden}
#budgit-household-prototype .bp-cat-track>span{display:block;height:100%;background:var(--bp-cat);border-radius:inherit}
#budgit-household-prototype .bp-cat-row strong{font-size:14px;font-weight:600}
#budgit-household-prototype .bp-category-list summary{list-style:none}
#budgit-household-prototype .bp-category-list summary::-webkit-details-marker{display:none}
#budgit-household-prototype .bp-cat-detail{padding:0 0 12px;font-size:13px}
#budgit-household-prototype .bp-cat-detail .bp-review-line{font-size:13px;align-items:center}
#budgit-household-prototype details[open]>.bp-cat-row>.bp-chevron{transform:rotate(-90deg)}
#budgit-household-prototype .bp-category-total{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
#budgit-household-prototype .bp-category-total strong{font-size:25px;font-weight:650;letter-spacing:-.6px}
#budgit-household-prototype .bp-record{padding:14px 16px}
#budgit-household-prototype .bp-record+.bp-record{margin-top:10px}
#budgit-household-prototype .bp-record summary{min-height:52px;font-size:15px}
#budgit-household-prototype .bp-record summary strong{float:left;margin-inline-start:10px;font-weight:600}
#budgit-household-prototype .bp-record summary small{display:block;margin-top:5px;font-size:12px;color:var(--bp-muted)}
#budgit-household-prototype .bp-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--bp-muted);margin-top:5px}
#budgit-household-prototype .bp-status.bp-cleared{color:var(--bp-good)}
#budgit-household-prototype .bp-obligation-section>h2{margin-bottom:8px}
#budgit-household-prototype .bp-loan-amount{font-size:32px;font-weight:650;display:block;letter-spacing:-.7px;margin:4px 0 14px}
#budgit-household-prototype .bp-inline-note{margin-top:8px!important}
#budgit-household-prototype .bp-sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#budgit-household-prototype .bp-category-card .bp-caption{margin-top:12px}
#budgit-household-prototype .bp-selected-summary .bp-cat-row{min-height:49px;padding-block:8px}
@media(max-width:380px){#budgit-household-prototype .bp-wallet-wrap{margin-inline:-14px}#budgit-household-prototype .bp-credit-face{padding:14px;width:80%}#budgit-household-prototype .bp-credit-name{font-size:16px}}
#budgit-household-prototype .bp-list{margin:0;padding-inline-start:20px;font-size:14px;display:grid;gap:10px}
@media(max-width:380px){#budgit-household-prototype{padding:8px 0 16px}#budgit-household-prototype .bp-context{padding-inline:14px}#budgit-household-prototype #bp-content{padding:16px 14px}#budgit-household-prototype .bp-value{font-size:32px}#budgit-household-prototype .bp-card{padding:15px}#budgit-household-prototype .bp-header{padding-inline:14px}}

@media(prefers-reduced-motion:no-preference){#budgit-household-prototype button{transition:background-color .16s,color .16s}#budgit-household-prototype .bp-meter span{transition:width .2s}}
#budgit-household-prototype .bp-field input{width:100%;min-width:0;min-height:46px;border:1px solid var(--bp-line);border-radius:10px;padding:10px;background:var(--bp-bg);color:var(--bp-text);font-size:16px}
#budgit-household-prototype .bp-form-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
#budgit-household-prototype .bp-form-grid .bp-field{margin:0}
#budgit-household-prototype .bp-record-sub{display:block;font-size:12px;color:var(--bp-muted);margin-top:4px}
#budgit-household-prototype .bp-entry-error{color:var(--bp-bad);font-size:14px;margin:12px 0!important}
#budgit-household-prototype .bp-warning{color:var(--bp-bad)}
#budgit-household-prototype .bp-projection{margin-top:14px}
#budgit-household-prototype .bp-projection summary{min-height:44px;font-size:14px}
#budgit-household-prototype .bp-projection table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
#budgit-household-prototype .bp-projection caption{text-align:start;color:var(--bp-muted);padding:8px 0}
#budgit-household-prototype .bp-projection td,#budgit-household-prototype .bp-projection th{padding:12px 2px;text-align:start;border-bottom:1px solid var(--bp-line);font-weight:400}
#budgit-household-prototype .bp-projection small{display:block;color:var(--bp-muted);font-size:11px}
#budgit-household-prototype .bp-calc-result .bp-review-line small{color:var(--bp-muted);font-size:12px}
#budgit-household-prototype .bp-assumptions .bp-plain{margin-top:6px}

 function entryForm(d){

 function saveEntry(){
  try{
   const draft=entry;if(!draft||!draft.name.trim())throw Error('יש להזין תיאור.');
   const amount=parseAmount(draft.amount,draft.page==='newincome'),scope=demoEntries[key()],record={name:draft.name.trim().slice(0,80),amount};
   if(draft.page==='newcheck'){
    if(!Object.hasOwn(categoryDefs,draft.category)||draft.category==='loans')throw Error('יש לבחור קטגוריה מהרשימה.');
    if(!/^\d{1,12}$/.test(draft.number))throw Error('יש להזין מספר צ׳ק תקין.');
    const date=new Date(draft.date+'T00:00:00Z');if(Number.isNaN(date.getTime())||date.toISOString().slice(0,10)!==draft.date||monthOffset(draft.date.slice(0,7))<0||monthOffset(draft.date.slice(0,7))>59)throw Error('בדוגמה יש לבחור מועד עתידי בין נובמבר 2026 לאוקטובר 2031.');
    if(scope.checks.some(c=>c.number===draft.number)||[data().commitment.checkNo,String(Number(data().commitment.checkNo)+1)].includes(draft.number))throw Error('מספר הצ׳ק כבר מופיע בחשבון הזה.');
    scope.checks.push({...record,number:draft.number,date:draft.date,category:draft.category});
   }else{
    const offset=monthOffset(draft.month);if(offset<0||offset>59)throw Error('בדוגמה יש לבחור חודש בין נובמבר 2026 לאוקטובר 2031.');
    if(draft.page==='newloan'){
     const months=Number(draft.months);if(!Number.isInteger(months)||months<1||months>60)throw Error('בדוגמה יש להזין 1–60 החזרים.');scope.loans.push({...record,month:draft.month,months});
    }else{if(!['monthly','once'].includes(draft.kind))throw Error('יש לבחור סוג הכנסה.');if(draft.kind==='monthly')scope.income=scope.income.filter(r=>r.kind!=='monthly'||r.month!==draft.month);scope.income.push({...record,month:draft.month,kind:draft.kind});}
   }
   const destination=draft.page==='newcheck'?'checks':draft.page==='newloan'?'loans':'income';entry=null;state.page=destination;trail.pop();render();save();announce('נשמר בדוגמה ומשפיע על המחשבון. נתוני האפליקציה לא השתנו.');
  }catch(error){root.querySelector('#bp-entry-error').textContent=error.message;}
 }

 }
 function selectCard(id,direction=0,focusSelector=''){const d=data(),c=d.cards.find(item=>item.id===id);if(!c)return;selections[key()]=id;render();const face=root.querySelector('.bp-credit-face.bp-selected');if(direction&&face?.animate&&!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)face.animate([{transform:`translateX(calc(-50% + ${direction*45}px))`,opacity:.8},{transform:'translateX(-50%)',opacity:1}],{duration:230,easing:'ease-out'});if(focusSelector)root.querySelector(focusSelector)?.focus();save();announce(c.label+' '+c.last4+' · חיובים מדווחים באוקטובר '+money(c.amount));}
 function stepCard(delta,focusSelector=''){const d=data(),i=Math.max(0,d.cards.findIndex(c=>c.id===selections[key()]));selectCard(d.cards[(i+delta+d.cards.length)%d.cards.length].id,delta,focusSelector);}
 function more(){return title('עוד')+`<section class="bp-card bp-menu">${[['calculator','calculator','מחשבון רכישה'],['income','banknote','הכנסות עתידיות'],['upload','files','דוחות ועדכונים'],['categories','chart-pie','הוצאות לפי קטגוריות'],['checks','notebook-pen','צ׳קים'],['loans','landmark','הלוואות'],['schedule','calendar-days','תכנון החודש']].map(([page,glyph,text])=>`<button type="button" data-page="${page}" class="cursor-interaction">${icon(glyph)}<span>${text}</span>${icon('chevron-left')}</button>`).join('')}<button type="button" data-action="privacy" class="cursor-interaction">${icon('shield-check')}<span>מי יכול לראות את המידע?</span>${icon('chevron-left')}</button></section><section class="bp-card"><h2>מראה</h2><label class="bp-field">ערכת נושא<select id="bp-theme"><option value="system" ${state.theme==='system'?'selected':''}>לפי המערכת</option><option value="light" ${state.theme==='light'?'selected':''}>בהיר</option><option value="dark" ${state.theme==='dark'?'selected':''}>כהה</option></select></label></section>`;}
 function upload(d){const seen=imported.has(key());return title('עדכון מדוח')+`<div class="bp-steps"><span class="${state.step===0?'bp-active':''}">1 · בחירה</span><span class="${state.step===1?'bp-active':''}">2 · בדיקה</span><span class="${state.step===2?'bp-active':''}">3 · סיום</span></div>`+(state.step===0?`<div class="bp-drop">${icon('file-up')}<h2>${seen?'הדוח לדוגמה כבר נקלט':'מעדכנים את תמונת המצב'}</h2><p class="bp-caption">דוח בנק · אוקטובר 2026 · חשבון ${d.last4}</p><button type="button" data-action="sample" class="bp-cta cursor-interaction">${seen?'בדיקת אותו דוח שוב':'בחירת דוח לדוגמה'}</button></div><p class="bp-caption">${label()} · קבצים אמיתיים אינם נפתחים באב־הטיפוס</p>`:state.step===1?`<section class="bp-card"><h2>${seen?'הדוח הזה כבר מופיע כאן':'בדיקה לפני עדכון'}</h2><div class="bp-review-line"><span>מרחב</span><strong>${scopeTitle()}</strong></div><div class="bp-review-line"><span>חשבון</span><bdi>${d.last4}</bdi></div><div class="bp-review-line"><span>תאריך היתרה</span><bdi>31.10.2026</bdi></div><div class="bp-review-line"><span>יתרה בדוח</span>${val(d.balance)}</div><p class="bp-caption" style="margin-top:14px">${seen?'אין צורך לקלוט אותו שוב.':label()+' · היתרה בדוח תואמת ליתרה המוצגת.'}</p></section><button type="button" data-action="${seen?'done':'confirm'}" class="bp-cta cursor-interaction">${seen?'חזרה לתמונה הכללית':'אישור קליטה בדוגמה'}</button><button type="button" data-action="cancel-import" class="bp-secondary cursor-interaction">ביטול</button>`:`<section class="bp-card bp-hero"><span class="bp-mark" style="margin:0 auto 14px">${icon('check')}</span><h2>הדוגמה נקלטה</h2><p style="margin-top:8px">הדוח שויך אל ${scopeTitle()}</p><p class="bp-caption" style="margin-top:8px">היתרה נשארה ${money(d.balance)} · אין שינוי בנתונים אמיתיים</p></section><button type="button" data-action="done" class="bp-cta cursor-interaction">חזרה לתמונה הכללית</button>`);}

 function navigate(next){if(state.page==='upload'&&state.step===1||entry?.dirty){pending=next;dialog(entry?.dirty?'לצאת בלי לשמור?':'לצאת מבדיקת הדוח?',`<p>יש שינויים שעדיין לא נשמרו בדוגמה. אפשר להישאר או לצאת ללא שמירה.</p>`,`<button type="button" class="bp-cta cursor-interaction" data-action="stay">להישאר</button><button type="button" class="bp-secondary cursor-interaction" data-action="leave">לצאת ללא שמירה</button>`);return;}next();state.step=0;announce('');render();save();}
 root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||!root.contains(button))return;if(!overlay.hidden&&!overlay.contains(button))return;const {scope,page,action,month,cardId}=button.dataset;if(cardId){selectCard(cardId,0,'.bp-wallet-dots [data-card-id="'+cardId+'"]');return;}if(action==='card-next'||action==='card-prev'){stepCard(action==='card-next'?1:-1,'[data-action="'+action+'"]');return;}if(month!==undefined&&/^[0-5]$/.test(month)){state.month=Number(month);render();root.querySelector('[data-month="'+month+'"]')?.focus();save();announceSelection();return;}if(['personal','shared'].includes(scope)){if(scope!==state.scope)navigate(()=>{entry=null;state.scope=scope;});return;}if(pages.includes(page)){navigate(()=>pushPage(page));return;}

  if(action==='privacy')dialog('המרחבים שלכם',`<ul class="bp-list"><li>האישי של טל — גלוי לטל בלבד</li><li>האישי של לינוי — גלוי ללינוי בלבד</li><li>המשותף — גלוי לשניכם</li></ul><p class="bp-caption">בחירת הדמות היא כלי בדיקה של האב־טיפוס. ביישום האמיתי ההרשאות נקבעות לפי החשבון המחובר.</p>`,`<button type="button" data-action="close" class="bp-cta cursor-interaction">הבנתי</button>`);
 });
 root.addEventListener('change',e=>{if(e.target.id==='bp-person'&&['tal','linoy'].includes(e.target.value)){const actor=e.target.value;e.target.value=state.actor;navigate(()=>{entry=null;trail=[];state.actor=actor;state.scope='personal';state.page='home';});}if(e.target.id==='bp-theme'&&['system','light','dark'].includes(e.target.value)){state.theme=e.target.value;render();save();announce('המראה עודכן');}if(e.target.id==='bp-category-month'&&/^[0-5]$/.test(e.target.value)){state.month=Number(e.target.value);render();root.querySelector('#bp-category-month')?.focus();save();announceSelection();}});
 function updatePlanningInput(e){
  const dataset=e.target.dataset||{};
  if(['price','payments','start','floor'].includes(dataset.calc)){
   calculatorInputs[key()][dataset.calc]=e.target.value;
   root.querySelector('#bp-calc-results').innerHTML=calculatorResult(data());
   root.querySelector('#bp-calc-hint').textContent='';
   if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
  }
  if(entry&&['name','amount','number','date','month','months','kind','category'].includes(dataset.entry)){
   entry[dataset.entry]=e.target.value;entry.dirty=true;
  }
 }
 root.addEventListener('input',updatePlanningInput);
 root.addEventListener('change',updatePlanningInput);
 root.addEventListener('submit',e=>{if(e.target.id==='bp-entry-form'){e.preventDefault();saveEntry();}});
 root.addEventListener('pointerdown',e=>{swipe=null;const stage=e.target.closest('.bp-wallet-stage');if(!stage||!overlay.hidden||!e.isPrimary||e.button!==0||e.target.closest('button'))return;swipe={x:e.clientX,y:e.clientY,id:e.pointerId,scope:key()};stage.setPointerCapture?.(e.pointerId);});
 root.addEventListener('pointerup',e=>{const start=swipe;swipe=null;if(!start||start.id!==e.pointerId||start.scope!==key()||state.page!=='accounts')return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();stepCard(dx>0?1:-1);}});
 root.addEventListener('pointercancel',()=>{swipe=null;});
 root.addEventListener('lostpointercapture',()=>{swipe=null;});
 root.addEventListener('keydown',e=>{if(!overlay.hidden||state.page!=='accounts'||!e.target.closest('.bp-wallet-wrap'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stepCard(e.key==='ArrowRight'?1:-1,'[data-action="card-next"]');}});
 root.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button')];if(!controls.length)return;const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 restore(window.openai?.widgetState);render();
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){closeDialog();entry=null;restore(e.detail.globals.widgetState);state.step=0;render();}});
 if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{render();save();}});tweak.addSlider(prefs,'spacing',{label:'ריווח בין חלקי המסך',min:12,max:24,step:2,unit:'px'});}
})();
</script>
