name: Security and release checks
on:
  push:
    branches: [main, codex/hetzner-google]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node build.mjs
      - run: node verify.mjs
      - run: node --test test/*.test.mjs
      - name: Production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Development dependencies
        run: npm audit --audit-level=moderate
      - name: Bundled parser advisory check
        run: node scripts/audit-vendor.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          pull: true
          tags: budgit-security-ci
      - name: Report all image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: budgit-security-ci
          format: table
          exit-code: '0'
      - name: Block fixable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: budgit-security-ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
